services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    volumes:
      - ddrive_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ddrive
      POSTGRES_DB: ddrive
      POSTGRES_PASSWORD: ddrive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddrive"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - config/.env
    environment:
      NODE_ENV: docker
      DATABASE_URL: postgres://ddrive:ddrive@postgres:5432/ddrive
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ddrive_data:
